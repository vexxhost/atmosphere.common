- name: Prepare Molecule log collection
  hosts: all
  become: true
  tasks:
    - name: Install jq for log collection
      ansible.builtin.apt:
        name: jq
        update_cache: true
      when:
        - ansible_facts['os_family'] | lower == 'debian'
