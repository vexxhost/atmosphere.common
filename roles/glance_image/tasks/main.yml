- name: Validate image source contract
  run_once: true
  ansible.builtin.assert:
    that:
      - >-
        (glance_image_url | length > 0)
        != (glance_image_oci_reference | length > 0)
      - >-
        glance_image_oci_reference | length == 0
        or glance_image_oci_reference
        is match('^[^@]+@sha256:[0-9a-f]{64}$')
      - >-
        glance_image_oci_reference | length == 0
        or glance_image_oci_path is match('^/[^/].*')
      - >-
        glance_image_oci_reference | length == 0
        or glance_image_oci_sha512 is match('^[0-9a-f]{128}$')
    fail_msg: >-
      Define exactly one image source: glance_image_url, or a digest-pinned
      glance_image_oci_reference with an absolute artifact path and SHA512.

- name: Capture immutable source identity
  run_once: true
  ansible.builtin.set_fact:
    _glance_image_source_url: >-
      {{
        glance_image_url
        if glance_image_url | length > 0
        else 'oci://' ~ glance_image_oci_reference ~ '#' ~ glance_image_oci_path
      }}
    # Reset per include_role loop item so a previous source ETag cannot leak.
    _glance_image_source_etag: ""

- name: Capture OCI source checksum
  when: glance_image_oci_reference | length > 0
  run_once: true
  ansible.builtin.set_fact:
    _glance_image_source_etag: "{{ glance_image_oci_sha512 }}"

- name: Fetch source image metadata from URL
  when: glance_image_url | length > 0
  run_once: true
  ansible.builtin.uri:
    url: "{{ glance_image_url }}"
    method: HEAD
    follow_redirects: all
    status_code: [200]
  register: _glance_image_source_head
  retries: 3
  delay: "{{ 15 | random + 3 }}"
  until: _glance_image_source_head is not failed
  environment:
    http_proxy: "{{ glance_image_http_proxy }}"
    https_proxy: "{{ glance_image_https_proxy }}"
    no_proxy: "{{ glance_image_no_proxy }}"

- name: Capture source ETag when available
  run_once: true
  when:
    - glance_image_url | length > 0
    - _glance_image_source_head.etag is defined
  ansible.builtin.set_fact:
    _glance_image_source_etag: "{{ _glance_image_source_head.etag | regex_replace('\"', '') }}"

- name: Check if image exists
  run_once: true
  openstack.cloud.image_info:
    cloud: "{{ glance_image_cloud }}"
    image: "{{ glance_image_name }}"
  register: _glance_image_info
  retries: 120
  delay: 1
  until: _glance_image_info is not failed

- name: Capture existing image and its Atmosphere metadata
  run_once: true
  ansible.builtin.set_fact:
    _glance_image_existing: "{{ _glance_image_info.images[0] | default({}) }}"
    _glance_image_existing_props: "{{ (_glance_image_info.images[0] | default({})).properties | default({}) }}"

- name: Decide whether image upload is required
  run_once: true
  ansible.builtin.set_fact:
    _glance_image_needs_upload: "{{
      (_glance_image_info.images | length == 0)
      or ((_glance_image_existing_props['atmosphere:image:url'] | default('')) != _glance_image_source_url)
      or (_glance_image_source_etag | length > 0
          and (_glance_image_existing_props['atmosphere:image:etag'] | default('')) != _glance_image_source_etag) }}"

- name: Download image and upload into Glance
  run_once: true
  when: _glance_image_needs_upload
  block:
    - name: Generate temporary work directory
      ansible.builtin.tempfile:
        path: "{{ glance_image_tempfile_path | default(omit) }}"
        state: directory
      register: _glance_image_workdir

    - name: Download image from HTTP
      when: glance_image_url | length > 0
      ansible.builtin.get_url:
        url: "{{ glance_image_url }}"
        dest: "{{ _glance_image_workdir.path }}/{{ glance_image_url | basename }}"
        mode: "0600"
        tmp_dest: "{{ _glance_image_workdir.path }}"
      register: _glance_image_get_url
      retries: 3
      delay: "{{ 15 | random + 3 }}"
      until: _glance_image_get_url is not failed
      environment:
        http_proxy: "{{ glance_image_http_proxy }}"
        https_proxy: "{{ glance_image_https_proxy }}"
        no_proxy: "{{ glance_image_no_proxy }}"

    - name: Capture HTTP image path
      when: glance_image_url | length > 0
      ansible.builtin.set_fact:
        _glance_image_download_dest: "{{ _glance_image_get_url.dest }}"

    - name: Extract image from OCI artifact
      when: glance_image_oci_reference | length > 0
      ansible.builtin.include_tasks: source_oci.yml

    - name: Get image format
      changed_when: false
      ansible.builtin.command:
        argv:
          - qemu-img
          - info
          - --output=json
          - "{{ _glance_image_download_dest }}"
      register: _glance_image_format

    - name: Convert file to target disk format
      when:
        - glance_image_disk_format not in ['aki', 'ari']
        - >-
          glance_image_disk_format
          != ((_glance_image_format.stdout | from_json).format)
      changed_when: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -O
          - "{{ glance_image_disk_format }}"
          - "{{ _glance_image_download_dest }}"
          - "{{ _glance_image_download_dest }}.converted"
      register: glance_image_conversion

    - name: Wait until image service ready
      when: glance_image_wait_for_api | bool
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ glance_image_api_deployment_name }}"
        namespace: "{{ glance_image_api_deployment_namespace }}"
        wait_sleep: 1
        wait_timeout: 600
        wait: true
        wait_condition:
          type: Available
          status: true

    - name: Compute pending image name
      vars:
        _new_etag_short: "{{ (_glance_image_source_etag | default('') | regex_replace('[^A-Za-z0-9]', ''))[:12] }}"
        _new_suffix: "{{ _new_etag_short if _new_etag_short | length > 0 else (ansible_date_time.epoch | default(lookup('pipe', 'date +%s'))) }}"
      ansible.builtin.set_fact:
        _glance_image_pending_name: >-
          {{ glance_image_name if (_glance_image_info.images | length == 0)
             else glance_image_name ~ '-pending-' ~ _new_suffix }}

    - name: Upload image into Glance
      openstack.cloud.image:
        cloud: "{{ glance_image_cloud }}"
        name: "{{ _glance_image_pending_name }}"
        filename: "{{ _glance_image_download_dest }}{% if glance_image_conversion is not skipped %}.converted{% endif %}"
        min_disk: "{{ glance_image_min_disk | default(omit) }}"
        min_ram: "{{ glance_image_min_ram | default(omit) }}"
        container_format: "{{ glance_image_container_format | default(omit) }}"
        disk_format: "{{ glance_image_disk_format | default(omit) }}"
        properties: >-
          {{
            (glance_image_properties | default({}))
            | combine({'atmosphere:image:url': _glance_image_source_url})
            | combine({'atmosphere:image:etag': _glance_image_source_etag} if _glance_image_source_etag | length > 0 else {})
          }}
        kernel: "{{ glance_image_kernel | default(omit) }}"
        ramdisk: "{{ glance_image_ramdisk | default(omit) }}"
        is_public: "{{ glance_image_is_public | default(omit) }}"
        tags: "{{ glance_image_tags | default(omit) }}"
        wait: true
        timeout: 600
      retries: "{{ glance_image_retries }}"
      delay: 5
      register: _glance_image_upload_result
      until: _glance_image_upload_result is not failed

    - name: Rename outdated image to preserve audit trail
      when: _glance_image_info.images | length > 0
      vars:
        _existing_etag_raw: "{{ _glance_image_existing_props['atmosphere:image:etag'] | default('') }}"
        _existing_etag_short: "{{ (_existing_etag_raw | regex_replace('[^A-Za-z0-9]', ''))[:12] }}"
        _existing_id_short: "{{ (_glance_image_existing.id | default('') | regex_replace('-', ''))[:12] }}"
        _existing_suffix: "{{ _existing_etag_short if _existing_etag_short | length > 0 else _existing_id_short }}"
      openstack.cloud.image:
        cloud: "{{ glance_image_cloud }}"
        id: "{{ _glance_image_existing.id }}"
        name: "{{ glance_image_name }}-{{ _existing_suffix }}"
        visibility: "{{ _glance_image_existing.visibility | default(omit) }}"
        tags:
          - atmosphere:image:obsolete
      retries: "{{ glance_image_retries }}"
      delay: 5
      register: _glance_image_rename_result
      until: _glance_image_rename_result is not failed

    - name: Promote newly uploaded image to canonical name
      when: _glance_image_pending_name != glance_image_name
      openstack.cloud.image:
        cloud: "{{ glance_image_cloud }}"
        id: "{{ _glance_image_upload_result.image.id }}"
        name: "{{ glance_image_name }}"
        visibility: "{{ _glance_image_upload_result.image.visibility | default(omit) }}"
      retries: "{{ glance_image_retries }}"
      delay: 5
      register: _glance_image_promote_result
      until: _glance_image_promote_result is not failed
  always:
    - name: Remove work directory
      ansible.builtin.file:
        path: "{{ _glance_image_workdir.path }}"
        state: absent
      when: _glance_image_workdir.path is defined
