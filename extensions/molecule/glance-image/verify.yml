- name: Verify Glance image lifecycle
  hosts: controllers
  become: true
  tasks:
    - name: Get initial image
      openstack.cloud.image_info:
        cloud: atmosphere
        image: molecule-glance-image
      register: _initial_image

    - name: Assert initial image properties
      ansible.builtin.assert:
        that:
          - _initial_image.images | length == 1
          - _initial_image.images[0].properties['atmosphere:image:url'] == 'http://127.0.0.1:18080/test.img'
          - _initial_image.images[0].properties['atmosphere:image:etag'] == 'glance-image-v1'
          - _initial_image.images[0].visibility | default('public') == 'public'

    - name: Run role again with unchanged ETag
      ansible.builtin.include_role:
        name: atmosphere.common.glance_image
      vars:
        glance_image_name: molecule-glance-image
        glance_image_url: http://127.0.0.1:18080/test.img
        glance_image_container_format: bare
        glance_image_disk_format: raw
        glance_image_is_public: true

    - name: Get image after unchanged ETag run
      openstack.cloud.image_info:
        cloud: atmosphere
        image: molecule-glance-image
      register: _idempotent_image

    - name: Assert unchanged ETag does not re-upload
      ansible.builtin.assert:
        that:
          - _idempotent_image.images | length == 1
          - _idempotent_image.images[0].id == _initial_image.images[0].id

    - name: Read the service project
      openstack.cloud.project_info:
        cloud: atmosphere
        name: service
        domain: service
      register: _service_project

    - name: Reconcile unchanged image access policy
      ansible.builtin.include_role:
        name: atmosphere.common.glance_image
      vars:
        glance_image_name: molecule-glance-image
        glance_image_url: http://127.0.0.1:18080/test.img
        glance_image_container_format: bare
        glance_image_disk_format: raw
        glance_image_owner: service
        glance_image_owner_domain: service
        glance_image_is_public: false

    - name: Read image after access policy reconciliation
      openstack.cloud.image_info:
        cloud: atmosphere
        image: molecule-glance-image
      register: _reconciled_image

    - name: Assert access policy changes without re-upload
      ansible.builtin.assert:
        that:
          - _service_project.projects | length == 1
          - _reconciled_image.images | length == 1
          - _reconciled_image.images[0].id == _initial_image.images[0].id
          - _reconciled_image.images[0].owner_id == _service_project.projects[0].id
          - _reconciled_image.images[0].visibility == 'private'

    - name: Change source ETag
      become: true
      ansible.builtin.copy:
        content: "glance-image-v2\n"
        dest: /var/lib/glance-image-source/etag
        mode: "0644"

    - name: Run role again with changed ETag
      ansible.builtin.include_role:
        name: atmosphere.common.glance_image
      vars:
        glance_image_name: molecule-glance-image
        glance_image_url: http://127.0.0.1:18080/test.img
        glance_image_container_format: bare
        glance_image_disk_format: raw
        glance_image_is_public: true

    - name: Get canonical image after ETag update
      openstack.cloud.image_info:
        cloud: atmosphere
        image: molecule-glance-image
      register: _updated_image

    - name: Compute expected obsolete image name
      ansible.builtin.set_fact:
        _expected_obsolete_image_name: >-
          molecule-glance-image-{{
            (_initial_image.images[0].properties['atmosphere:image:etag']
             | regex_replace('[^A-Za-z0-9]', ''))[:12]
          }}

    - name: Get obsolete image after ETag update
      openstack.cloud.image_info:
        cloud: atmosphere
        image: "{{ _expected_obsolete_image_name }}"
      register: _obsolete_image

    - name: Assert image update behavior
      ansible.builtin.assert:
        that:
          - _updated_image.images | length == 1
          - _updated_image.images[0].id != _initial_image.images[0].id
          - _updated_image.images[0].properties['atmosphere:image:etag'] == 'glance-image-v2'
          - _updated_image.images[0].visibility | default('public') == 'public'
          - _obsolete_image.images | length == 1
          - _obsolete_image.images[0].name == _expected_obsolete_image_name
          - "'atmosphere:image:obsolete' in _obsolete_image.images[0].tags"
