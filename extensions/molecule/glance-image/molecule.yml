dependency:
  name: galaxy
  options:
    requirements-file: extensions/molecule/glance-image/requirements.yml
ansible:
  cfg:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      inject_facts_as_vars: false
    connection:
      pipelining: true
    tags:
      skip: >-
        sysctl,
        ethtool
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/inventory.yaml
